apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  apiVersion: apiserver.config.k8s.io/v1beta1
  kind: AuthenticationConfiguration
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  jwt:
    - issuer:
        url: https://auth.l3b.cc.cd
        audiences:
          - headlamp
      claimMappings:
        username:
          claim: email
          prefix: "oidc:"
        groups:
          claim: groups
          prefix: "oidc:"
        uid:
          claim: sub
