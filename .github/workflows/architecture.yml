name: Architecture diagrams
on:
  pull_request:
    paths: ['docs/architecture/**', '.github/workflows/architecture.yml']
  push:
    paths: ['docs/architecture/**', '.github/workflows/architecture.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node docs/architecture/build.mjs
      - run: node docs/architecture/check.mjs
      - run: node docs/architecture/check-topology.mjs
      - name: Reject stale generated SVGs
        run: git diff --exit-code -- docs/architecture/homelab.svg docs/architecture/flows.svg
