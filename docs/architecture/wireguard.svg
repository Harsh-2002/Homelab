<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="320" viewBox="0 0 1580 320" role="img"><title>New l3b host WireGuard routed access</title><desc>Local handshake passed. Public DNS ready; router route and external forwarding acceptance pending.</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#52636d"/></marker></defs><rect width="1580" height="320" fill="#f8fafb"/><text x="30" y="48" font-family="sans-serif" font-size="26">WireGuard / l3b / 2026-11-01</text><rect x="30" y="100" width="350" height="100" rx="10" fill="#edf4f8" stroke="#52636d"/><text x="205" y="155" text-anchor="middle" font-family="sans-serif" font-size="20">Remote WireGuard client</text><rect x="420" y="100" width="350" height="100" rx="10" fill="#edf4f8" stroke="#52636d"/><text x="595" y="155" text-anchor="middle" font-family="sans-serif" font-size="20">Router / UDP port forward</text><rect x="810" y="100" width="350" height="100" rx="10" fill="#edf4f8" stroke="#52636d"/><text x="985" y="155" text-anchor="middle" font-family="sans-serif" font-size="20">l3b host / wg0</text><rect x="1200" y="100" width="350" height="100" rx="10" fill="#edf4f8" stroke="#52636d"/><text x="1375" y="155" text-anchor="middle" font-family="sans-serif" font-size="20">Home LAN</text><path d="M380 150 h40" stroke="#52636d" marker-end="url(#a)"/><path d="M770 150 h40" stroke="#52636d" marker-end="url(#a)"/><path d="M1160 150 h40" stroke="#52636d" marker-end="url(#a)"/><text x="30" y="245" font-family="sans-serif" font-size="20">Routed return path through home router; peer isolation; Docker firewall preserved.</text><text x="30" y="280" font-family="sans-serif" font-size="18">Local encrypted handshake and SSH passed. Public DNS ready. Router forwarding / route and remote acceptance pending.</text></svg>
