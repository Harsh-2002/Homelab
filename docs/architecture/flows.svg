<text x="1144" y="1459" font-size="25" fill="#18252c" font-weight="600" >Frigate · ctr / Intel iGPU</text>
<text x="1144" y="1490" font-size="21" fill="#52636d" font-weight="400" >Camera ingest / recording</text>
<text x="1144" y="1519" font-size="21" fill="#52636d" font-weight="400" >RTSP restream + MQTT → HA</text>
</g>
<g data-node="true">
<rect x="1684" y="1425" width="652" height="124" rx="12" fill="#ffffff" stroke="#c7d2d7" stroke-width="1.5"/>
<text x="1706" y="1459" font-size="25" fill="#18252c" font-weight="600" >Metrics · observability LXC</text>
<text x="1706" y="1490" font-size="21" fill="#52636d" font-weight="400" >Exporters + Kubernetes vmagent → VictoriaMetrics</text>
<text x="1706" y="1519" font-size="21" fill="#52636d" font-weight="400" >Grafana / HA node views; Beszel / Kuma monitoring</text>
</g>
<path d="M484 1487H558" fill="none" stroke="#52636d" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M1122 1487H1048" fill="none" stroke="#52636d" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="64" y="1600" font-size="22" fill="#52636d" font-weight="400" >Local device protocols avoid cloud commands; a full WAN-outage acceptance test remains outstanding.</text>
<text x="64" y="1650" font-size="21" fill="#52636d" font-weight="400" >Solid arrows: application / data path</text>
