<text x="1320" y="1650" font-size="21" fill="#52636d" font-weight="400" >Not a live health map; see the inventory notes for verification limits.</text>
<path d="M64 1732H2336" fill="none" stroke="#c7d2d7" stroke-width="2" stroke-linejoin="round"  />
<text x="64" y="1771" font-size="20" fill="#52636d" font-weight="400" >Schemas are simplified; replicated storage and HA are not independent backups.</text>
