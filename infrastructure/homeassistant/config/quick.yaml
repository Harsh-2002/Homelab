title: Quick
views:
- title: Quick
  path: quick
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Room
      icon: mdi:sofa
    - type: tile
      entity: light.behind_monitor_bulb
      grid_options:
        columns: 12
      name: Bulb
      features:
      - type: light-brightness
    - type: tile
      entity: climate.samsung_room_ac
      grid_options:
        columns: 12
      name: Room AC
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - 'off'
        - auto
        - cool
        - dry
        - fan_only
      - type: target-temperature
  - type: grid
    cards:
    - type: heading
      heading: Outdoor
      icon: mdi:cctv
    - type: picture-entity
      entity: camera.outdoor
      name: Outdoor
      camera_view: auto
      show_state: false
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Switches
      icon: mdi:toggle-switch-outline
    - type: tile
      entity: switch.outdoor_detect
      grid_options:
        columns: 6
      name: Detection
    - type: tile
      entity: switch.outdoor_recordings
      grid_options:
        columns: 6
      name: Recording
    - type: tile
      entity: switch.outdoor_snapshots
      grid_options:
        columns: 6
      name: Snapshots
    - type: tile
      entity: switch.outdoor_review_alerts
      grid_options:
        columns: 6
      name: Camera alerts
    - type: tile
      entity: input_boolean.samsung_ac_daily_schedule
      grid_options:
        columns: 6
      name: AC schedule
      icon: mdi:calendar-clock
    - type: tile
      entity: input_boolean.samsung_ac_local_alerts
      grid_options:
        columns: 6
      name: AC alerts
      icon: mdi:bell-outline
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Homelab
      icon: mdi:server
    - type: tile
      entity: sensor.host_cpu
      name: CPU
      icon: mdi:cpu-64-bit
      color: green
      grid_options:
        columns: 6
      features:
      - type: bar-gauge
        min: 0
        max: 100
      visibility:
      - condition: numeric_state
        entity: sensor.host_cpu
        below: 70
      tap_action:
        action: navigate
        navigation_path: /homelab-status/nodes
    - type: tile
      entity: sensor.host_cpu
      name: CPU
      icon: mdi:cpu-64-bit
      color: orange
      grid_options:
        columns: 6
      features:
      - type: bar-gauge
        min: 0
        max: 100
      visibility:
      - condition: numeric_state
        entity: sensor.host_cpu
        above: 69.9999
        below: 90
      tap_action:
        action: navigate
        navigation_path: /homelab-status/nodes
    - type: tile
      entity: sensor.host_cpu
      name: CPU
      icon: mdi:cpu-64-bit
      color: red
      grid_options:
        columns: 6
      features:
      - type: bar-gauge
        min: 0
        max: 100
      visibility:
      - condition: numeric_state
        entity: sensor.host_cpu
        above: 89.9999
      tap_action:
        action: navigate
        navigation_path: /homelab-status/nodes
    - type: tile
      entity: sensor.host_cpu
      name: CPU
      icon: mdi:cpu-64-bit
      color: grey
      grid_options:
        columns: 6
      features:
      - type: bar-gauge
        min: 0
        max: 100
      visibility:
      - condition: state
        entity: sensor.host_cpu
        state:
        - unavailable
        - unknown
      tap_action:
        action: navigate
        navigation_path: /homelab-status/nodes
