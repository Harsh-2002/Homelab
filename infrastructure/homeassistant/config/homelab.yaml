title: Homelab
views:
  - title: Cameras
    path: cameras
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Outdoor
            heading_style: title
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.outdoor
            name: Outdoor
            camera_view: live
            show_state: false
            show_name: false
            aspect_ratio: "16:9"
            grid_options:
              columns: full
          - type: tile
            entity: binary_sensor.outdoor_motion
            name: Motion
          - type: tile
            entity: binary_sensor.outdoor_person_occupancy
            name: Person
          - type: tile
            entity: binary_sensor.outdoor_dog_occupancy
            name: Dog
          - type: tile
            entity: sensor.outdoor_all_count
            name: Objects
      - type: grid
        cards:
          - type: heading
            heading: Camera controls
            heading_style: title
            icon: mdi:record-rec
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.outdoor_detect
                name: Object detection
              - entity: switch.outdoor_motion
                name: Motion detection
              - entity: switch.outdoor_recordings
                name: Recordings
              - entity: switch.outdoor_snapshots
                name: Snapshots
          - type: tile
            entity: camera.outdoor
            name: Open Frigate
            icon: mdi:cctv
            hide_state: true
            tap_action:
              action: url
              url_path: https://frigate.l3b.cc.cd
            icon_tap_action:
              action: url
              url_path: https://frigate.l3b.cc.cd
            grid_options:
              columns: full
  - title: Nodes
    path: nodes
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: l3b
            icon: mdi:server
            badges:
              - type: entity
                entity: sensor.host_containers
                name: Running
              - type: entity
                entity: sensor.host_unhealthy
                name: Unhealthy
              - type: entity
                entity: sensor.host_uptime_hours
                name: Uptime
          - type: tile
            entity: sensor.host_cpu
            name: CPU
            icon: mdi:cpu-64-bit
            color: blue
            grid_options:
              columns: 12
            features:
              - type: bar-gauge
                min: 0
                max: 100
          - type: tile
            entity: sensor.host_memory
            name: Memory
            icon: mdi:memory
            color: purple
            grid_options:
              columns: 12
            features:
              - type: bar-gauge
                min: 0
                max: 100
          - type: tile
            entity: sensor.host_temperature
            name: CPU temperature
            icon: mdi:thermometer
            color: orange
            grid_options:
              columns: 12
            features:
              - type: bar-gauge
                min: 20
                max: 100
      - type: grid
        cards:
          - type: heading
            heading: Last 6 hours
            icon: mdi:chart-line
          - type: history-graph
            title: CPU and memory
            hours_to_show: 6
            show_names: true
            grid_options:
              columns: 12
            entities:
              - entity: sensor.host_cpu
                name: CPU
              - entity: sensor.host_memory
                name: Memory
          - type: history-graph
            title: Temperature
            hours_to_show: 6
            show_names: false
            grid_options:
              columns: 12
            entities:
              - entity: sensor.host_temperature
                name: CPU
          - type: history-graph
            title: Load
            hours_to_show: 6
            show_names: false
            grid_options:
              columns: 12
            entities:
              - entity: sensor.host_load
                name: 1 min
      - type: grid
        cards:
          - type: heading
            heading: Storage
            icon: mdi:harddisk
          - type: tile
            entity: sensor.host_disk_root
            name: Root, NVMe
            icon: mdi:harddisk
            color: red
            grid_options:
              columns: 12
            features:
              - type: bar-gauge
                min: 0
                max: 100
          - type: tile
            entity: sensor.host_disk_data
            name: Data, SATA
            icon: mdi:database
            color: green
            grid_options:
              columns: 12
            features:
              - type: bar-gauge
                min: 0
                max: 100
          - type: tile
            entity: sensor.host_disk_backup
            name: Backup, USB
            icon: mdi:backup-restore
            color: teal
            grid_options:
              columns: 12
            features:
              - type: bar-gauge
                min: 0
                max: 100
          - type: heading
            heading: Docker
            icon: mdi:docker
          - type: tile
            entity: sensor.host_containers
            name: Containers running
            icon: mdi:docker
            color: blue
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.host_unhealthy
            name: Unhealthy
            icon: mdi:alert-circle-outline
            color: red
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.host_memory_used
            name: Memory used
            icon: mdi:memory
            color: purple
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.host_uptime_hours
            name: Uptime
            icon: mdi:clock-outline
            color: grey
            grid_options:
              columns: 6
