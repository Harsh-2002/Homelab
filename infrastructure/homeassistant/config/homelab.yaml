title: Homelab
views:
  - title: Cameras
    path: cameras
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Outdoor
            heading_style: title
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.outdoor
            name: Outdoor
            camera_view: live
            show_state: false
            show_name: false
            aspect_ratio: "16:9"
            grid_options:
              columns: full
          - type: tile
            entity: binary_sensor.outdoor_motion
            name: Motion
          - type: tile
            entity: binary_sensor.outdoor_person_occupancy
            name: Person
          - type: tile
            entity: binary_sensor.outdoor_dog_occupancy
            name: Dog
          - type: tile
            entity: sensor.outdoor_all_count
            name: Objects
      - type: grid
        cards:
          - type: heading
            heading: Camera controls
            heading_style: title
            icon: mdi:record-rec
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.outdoor_detect
                name: Object detection
              - entity: switch.outdoor_motion
                name: Motion detection
              - entity: switch.outdoor_recordings
                name: Recordings
              - entity: switch.outdoor_snapshots
                name: Snapshots
          - type: tile
            entity: camera.outdoor
            name: Open Frigate
            icon: mdi:cctv
            hide_state: true
            tap_action:
              action: url
              url_path: https://frigate.l3b.cc.cd
            icon_tap_action:
              action: url
              url_path: https://frigate.l3b.cc.cd
            grid_options:
              columns: full
  - title: Nodes
    path: nodes
    type: sections
    max_columns: 4
    sections:
    - type: grid
      column_span: 4
      cards:
      - type: heading
        heading: l3b
        icon: mdi:server
