        entity: sensor.host_cpu
        name: CPU
        icon: mdi:cpu-64-bit
        color: green
        grid_options:
          columns: 6
        features:
        - type: bar-gauge
          min: 0
          max: 100
        visibility:
        - condition: numeric_state
          entity: sensor.host_cpu
          below: 70
      - type: tile
        entity: sensor.host_cpu
        name: CPU
        icon: mdi:cpu-64-bit
        color: orange
        grid_options:
          columns: 6
        features:
        - type: bar-gauge
          min: 0
          max: 100
        visibility:
        - condition: numeric_state
          entity: sensor.host_cpu
          above: 69.9999
          below: 90
      - type: tile
        entity: sensor.host_cpu
