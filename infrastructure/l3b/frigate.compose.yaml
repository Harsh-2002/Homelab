services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    container_name: frigate
    restart: unless-stopped
    init: false
    shm_size: 512mb
    stop_grace_period: 30s
    env_file:
      - /data/apps/frigate/runtime.env
    environment:
      TZ: Asia/Kolkata
      LIBVA_DRIVER_NAME: i965
    expose:
      - "8971"
      - "5000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /data/apps/frigate/config:/config
      - /data/apps/frigate/media:/media/frigate
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    cap_add:
      - PERFMON
    group_add:
      - "44"
      - "991"
    tmpfs:
      - /tmp/cache:rw,size=2000000000
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:5000/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - l3b

networks:
  l3b:
    external: true
    name: l3b
