services:
  unbound:
    image: klutchell/unbound@sha256:50cbeb32b5838a829a7226b19cb151f9535bd7f9f3190f950780f452fe807478
    container_name: unbound
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    user: 1000:1000
    command: [-d, -c, /etc/unbound/unbound.conf]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /data/apps/unbound/unbound.conf:/etc/unbound/unbound.conf:ro
      - /data/apps/unbound/state:/var/lib/unbound
    restart: unless-stopped
    healthcheck:
      test: [CMD, /usr/bin/drill-hc, -p, "5335", "@127.0.0.1", ., SOA]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  adguard:
    image: adguard/adguardhome@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    container_name: adguard
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - ${L3B_BIND_IP}:53:53/udp
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m
    volumes:
      - /data/apps/adguard/conf:/opt/adguardhome/conf
      - /data/apps/adguard/work:/opt/adguardhome/work
    depends_on:
      unbound:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/,]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
    external: true
    name: l3b
