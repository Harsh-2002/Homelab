services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    init: false
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      WEBUI_PORT: "8081"
      TORRENTING_PORT: "6881"
    expose:
      - "8081"
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, "5", -o, /dev/null, http://127.0.0.1:8081/]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - /data/apps/qbittorrent:/config
      - /mnt/AV:/data
    networks:
      - l3b

networks:
  l3b:
    external: true
    name: l3b
