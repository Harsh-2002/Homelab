services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:14
    container_name: forgejo
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: Asia/Kolkata
    expose:
      - "3000"
      - "22"
    volumes:
      - /data/apps/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - l3b

  forgejo-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:latest
    container_name: forgejo-mirror
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - /data/apps/gitea-mirror:/app/data
    networks:
      - l3b

networks:
  l3b:
    external: true
    name: l3b
