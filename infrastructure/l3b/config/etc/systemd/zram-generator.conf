# Compressed swap in RAM for the single-node l3b host (owner-approved 2026-11-17).
# Sits in front of the NVMe /swapfile (priority -1): pages go here first, the
# swapfile only receives overflow.
[zram0]
# Virtual size: a quarter of RAM (about 7.8 GiB on this 31 GiB host).
zram-size = ram / 4
# Hard cap on real RAM the compressed pages may occupy (about 3.9 GiB).
zram-resident-limit = ram / 8
compression-algorithm = zstd
swap-priority = 100
