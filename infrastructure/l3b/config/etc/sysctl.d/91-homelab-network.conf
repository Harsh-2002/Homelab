# Network tuning for the single-node l3b host (owner-approved 2026-11-17).
# Applied after 90-homelab.conf. Measured baseline: cubic/fq_codel, 1 Gbps e1000e,
# 0.04% rx drops, 1569 UDP receive-buffer overflows over 8 days.

# Keep a connection's congestion window after it goes idle. Caddy holds
# long-lived HTTP/2 connections; this avoids a slow restart after each pause.
net.ipv4.tcp_slow_start_after_idle = 0

# Larger default socket buffers (rmem_max/wmem_max are already 4 MB).
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Larger queue before the kernel drops packets under bursts.
net.core.netdev_max_backlog = 5000

# Match somaxconn (4096) for bursts of new connections.
net.ipv4.tcp_max_syn_backlog = 4096
