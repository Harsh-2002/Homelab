services:
  paperless-broker:
    image: docker.io/valkey/valkey:9-alpine
    container_name: paperless-broker
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "valkey-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /data/apps/paperless/valkey:/data
    networks:
      - l3b

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
    container_name: paperless
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    init: false
    env_file:
      - /data/apps/paperless/runtime.env
    depends_on:
      - paperless-broker
    expose:
      - "8000"
    volumes:
      - /data/apps/paperless/data:/usr/src/paperless/data
      - /data/apps/paperless/media:/usr/src/paperless/media
      - /data/apps/paperless/consume:/usr/src/paperless/consume
      - /data/apps/paperless/export:/usr/src/paperless/export
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/accounts/login/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - l3b

networks:
  l3b:
    external: true
    name: l3b
