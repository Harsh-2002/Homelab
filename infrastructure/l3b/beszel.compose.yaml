# Docker hub only. The host agent runs natively as beszel-agent.service.
services:
  beszel:
    image: henrygd/beszel:0.21.1
    container_name: beszel
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    env_file:
      - /data/apps/beszel/hub.env
    expose:
      - "8090"
    volumes:
      - /data/apps/beszel/data:/beszel_data
    healthcheck:
      test: [CMD, /beszel, health, --url, http://localhost:8090]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - l3b

networks:
  l3b:
    external: true
    name: l3b
