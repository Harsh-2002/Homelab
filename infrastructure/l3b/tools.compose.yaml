services:
  playwright:
    image: mcr.microsoft.com/playwright/mcp@sha256:690763cbb437ee7233f538a953bb5390bf03791eb5c965b471e59d17a6132fcb
    container_name: playwright
    entrypoint: node
    command: [/opt/homelab/browser-tools.cjs]
    volumes:
      - /home/dev/Homelab/infrastructure/l3b/browser-tools.cjs:/opt/homelab/browser-tools.cjs:ro
    shm_size: 1gb
    tmpfs:
      - /tmp:size=1g
    restart: unless-stopped

networks:
  default:
    external: true
    name: l3b
