services:
  orva:
    image: ghcr.io/harsh-2002/orva@sha256:e23501aedfae388261bffb91bdc2621eb5c4ec8ccf43437e4ce94204aef1f7be
    container_name: orva
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    cgroup: host
    pid: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /data/apps/orva:/var/lib/orva
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      ORVA_DATA_DIR: /var/lib/orva
      ORVA_HOST: 0.0.0.0
      ORVA_PORT: "8443"
      ORVA_WRITE_TIMEOUT_SEC: "90"
      ORVA_SESSION_DAYS: "30"
      ORVA_TRUSTED_PROXY: "true"
      ORVA_IMAGE: ghcr.io/harsh-2002/orva@sha256:e23501aedfae388261bffb91bdc2621eb5c4ec8ccf43437e4ce94204aef1f7be
    expose:
      - "8443"
    mem_limit: 4g
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8443/api/v1/system/health]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - l3b

networks:
  l3b:
    external: true
    name: l3b
