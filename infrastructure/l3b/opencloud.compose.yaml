services:
  opencloud:
    image: opencloudeu/opencloud:7.2.4
    container_name: opencloud
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh"]
    command: ["-c", "opencloud init --insecure false || true; opencloud server"]
    env_file:
      - /data/apps/opencloud/runtime.env
    volumes:
      - /data/apps/opencloud/config:/etc/opencloud
      - /data/apps/opencloud/data:/var/lib/opencloud
    expose:
      - "9200"
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9200/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - l3b

networks:
  l3b:
    external: true
    name: l3b
