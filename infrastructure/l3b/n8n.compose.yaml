services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    env_file:
      - /data/apps/n8n/runtime.env
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_HOST: n8n.l3b.cc.cd
      N8N_PROTOCOL: https
      NODE_ENV: production
      N8N_SECURE_COOKIE: "true"
      WEBHOOK_URL: https://n8n.l3b.cc.cd
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      EXECUTIONS_MODE: regular
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
    expose:
      - "5678"
    volumes:
      - /data/apps/n8n/data:/home/node/.n8n
      - /data/apps/n8n/files:/files
    depends_on:
      n8n-db:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - l3b

  n8n-db:
    image: postgres:18-alpine
    container_name: n8n-db
    restart: unless-stopped
    env_file:
      - /data/apps/n8n/db.env
    volumes:
      - /data/apps/n8n/db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U n8n -d n8n]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - l3b

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    env_file:
      - /data/apps/n8n/searxng.env
    volumes:
      - /data/apps/n8n/searxng-settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - l3b

networks:
  l3b:
    external: true
    name: l3b
