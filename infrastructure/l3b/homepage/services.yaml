- Control:
    - AdGuard Home:
        icon: adguard-home.png
        href: https://dns.l3b.cc.cd
        description: DNS filtering and recursive DNSSEC
        siteMonitor: http://adguard:3000/
        widget:
          type: adguard
          url: http://adguard:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
          fields: [queries, blocked, latency]
    - Portainer:
        icon: portainer.png
        href: https://portainer.l3b.cc.cd
        description: Docker stacks on l3b
        siteMonitor: http://portainer:9000/api/status
    - Pocket ID:
        icon: pocket-id.png
        href: https://auth.l3b.cc.cd
        description: Passkeys and application identity
        siteMonitor: http://pocketid:1411/healthz
- Applications:
    - OpenViking:
        icon: https://memory.l3b.cc.cd/favicon.ico
        href: https://memory.l3b.cc.cd/studio
        description: Persistent shared agent memory
        siteMonitor: http://openviking:1933/health
    - OpenCode:
        icon: https://oc.l3b.cc.cd/favicon.ico
        href: https://oc.l3b.cc.cd
        description: Native coding workspace
        siteMonitor: http://opencode:4096/
