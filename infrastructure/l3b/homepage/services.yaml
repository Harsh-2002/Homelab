- Control:
    - AdGuard Home:
        icon: adguard-home.png
        href: https://dns.l3b.cc.cd
        description: DNS filtering and recursive DNSSEC
        siteMonitor: http://adguard:3000/
        widget:
          type: adguard
          url: http://adguard:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
          fields: [queries, blocked, latency]
    - Portainer:
        icon: portainer.png
        href: https://portainer.l3b.cc.cd
        description: Docker stacks on l3b
        siteMonitor: http://portainer:9000/api/status
    - Pocket ID:
        icon: pocket-id.png
        href: https://auth.l3b.cc.cd
        description: Passkeys and application identity
        siteMonitor: http://pocketid:1411/healthz
- Applications:
    - OpenViking:
        icon: https://memory.l3b.cc.cd/favicon.ico
        href: https://memory.l3b.cc.cd/studio
        description: Persistent shared agent memory
        siteMonitor: http://openviking:1933/health
    - OpenCode:
        icon: https://oc.l3b.cc.cd/favicon.ico
        href: https://oc.l3b.cc.cd
        description: Native coding workspace
        siteMonitor: http://opencode:4096/
    - Nivra:
        icon: nivra.png
        href: https://notes.l3b.cc.cd
        description: Private notes and tasks
        siteMonitor: http://nivra:3000/health
    - Orva:
        icon: https://orva.l3b.cc.cd/favicon.ico
        href: https://orva.l3b.cc.cd
        description: Serverless functions and Quick Share
        siteMonitor: http://orva:8443/api/v1/system/health
    - Karakeep:
        icon: https://pin.l3b.cc.cd/favicon.ico
        href: https://pin.l3b.cc.cd
        description: Bookmarks, notes and search
        siteMonitor: http://karakeep:3000/
    - Immich:
        icon: https://photos.l3b.cc.cd/favicon.ico
        href: https://photos.l3b.cc.cd
        description: Private photo and video library
        siteMonitor: http://immich:2283/api/server/ping
    - OpenCloud:
        icon: https://drive.l3b.cc.cd/favicon.ico
        href: https://drive.l3b.cc.cd
        description: Private files and collaboration
        siteMonitor: http://opencloud:9200/
