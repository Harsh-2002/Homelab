# Generic Portainer stack: dashboard; actual service: homepage.
services:
  homepage:
    extra_hosts:
      - opencode:10.1.3.1
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: homepage
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    user: 1000:1000
    # Next.js regenerates /app/.next/server/pages for settings/theme changes.
    # Keep that image-owned runtime writable; persistent config is the bind mount.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOMEPAGE_ALLOWED_HOSTS: l3b.cc.cd,homepage:3000
    env_file:
      - /data/apps/homepage/runtime.env
    volumes:
      - /data/apps/homepage/config:/app/config
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000
    networks: [l3b]
    restart: unless-stopped

networks:
  l3b:
    external: true
