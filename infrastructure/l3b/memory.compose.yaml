services:
  openviking:
    image: ghcr.io/volcengine/openviking@sha256:f52ab2c309e46e47a746ffc5715bb280111588ff27bc7c9ae62ef5b915df9de1
    container_name: openviking
    restart: unless-stopped
    environment:
      OPENVIKING_WITH_BOT: "0"
      OPENVIKING_PUBLIC_BASE_URL: https://memory.l3b.cc.cd
    env_file:
      - /data/apps/openviking/runtime.env
    volumes:
      - /data/apps/openviking/state:/app/.openviking
      - /data/apps/openviking/state/hotfixes/session_commit_processor.py:/app/.venv/lib/python3.13/site-packages/openviking/storage/queuefs/session_commit_processor.py:ro
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: [CMD, openviking-entrypoint, --healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
  ollama:
    image: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - /data/apps/openviking/ollama:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
networks:
  default:
    external: true
    name: l3b
