services:
  desktop:
    image: registry.l3b.cc.cd/os:selkies
    container_name: desktop
    hostname: ubuntu-desktop
    restart: unless-stopped
    pull_policy: always
    shm_size: "2g"
    security_opt:
      - seccomp=unconfined
    environment:
      TZ: Asia/Kolkata
      DISPLAY_SIZEW: "1600"
      DISPLAY_SIZEH: "900"
      SELKIES_AUDIO_ENABLED: "true"
      SELKIES_ENABLE_RESIZE: "true"
      SELKIES_SCALING_DPI: "168"
      SELKIES_ENCODER: "h264enc"
      SELKIES_RATE_CONTROL_MODE: "cbr"
      SELKIES_VIDEO_BITRATE: "60000"
      SELKIES_FRAMERATE: "60"
      SELKIES_ENABLE_HTTPS: "false"
      SELKIES_ENABLE_BASIC_AUTH: "false"
      SELKIES_UI_TITLE: "Ubuntu Desktop"
      SELKIES_UI_SHOW_LOGO: "false"
      SELKIES_UI_SHOW_CORE_BUTTONS: "false"
      SELKIES_UI_SHOW_SIDEBAR: "true"
      SELKIES_UI_LAYOUT: "default"
      SELKIES_AUDIO_ON_START: "true"
      SELKIES_MICROPHONE_ENABLED: "true"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /data/apps/desktop/home:/home/ubuntu
    networks:
      - l3b
    mem_limit: 10g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  l3b:
    external: true
