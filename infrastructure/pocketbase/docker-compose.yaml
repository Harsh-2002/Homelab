name: pocketbase
services:
  pocketbase:
    image: homelab/pocketbase:0.40.5
    build: .
    container_name: pocketbase
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      GOMEMLIMIT: 384MiB
      TZ: UTC
    ports:
      - "10.1.1.14:8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations:ro
      - ./pb_hooks:/pb/pb_hooks:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8090/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
