{
  "storage": {
    "workspace": "./data",
    "vectordb": {
      "name": "context",
      "backend": "local"
    },
    "agfs": {
      "backend": "local"
    }
  },
  "embedding": {
    "dense": {
      "provider": "ollama",
      "api_base": "http://ollama:11434/v1",
      "model": "all-minilm",
      "dimension": 384,
      "input": "text"
    }
  },
  "vlm": {
    "provider": "openai-codex",
    "model": "gpt-6-luna",
    "api_base": "https://chatgpt.com/backend-api/codex"
  },
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "api_key",
    "root_api_key": "${OPENVIKING_ROOT_API_KEY}",
    "public_base_url": "https://memory.l3b.cc.cd",
    "cors_origins": ["https://memory.l3b.cc.cd"]
  }
}
