{
  "storage": {
    "workspace": "./data",
    "vectordb": {
      "name": "context",
      "backend": "local"
    },
    "agfs": {
      "backend": "local"
    }
  },
  "embedding": {
    "dense": {
      "provider": "ollama",
      "api_base": "http://ollama:11434/v1",
      "model": "all-minilm",
      "dimension": 384,
      "input": "text"
    }
  },
  "vlm": {
    "provider": "openai",
    "model": "openai/gpt-oss-120b",
    "credentials": [
      {
        "id": "groq",
        "provider": "openai",
        "model": "openai/gpt-oss-120b",
        "api_base": "https://api.groq.com/openai/v1",
        "api_key": "${GROQ_API_KEY}"
      },
      {
        "id": "cerebras",
        "provider": "openai",
        "model": "gpt-oss-120b",
        "api_base": "https://api.cerebras.ai/v1",
        "api_key": "${CEREBRAS_API_KEY}"
      }
    ]
  },
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "api_key",
    "root_api_key": "${OPENVIKING_ROOT_API_KEY}",
    "public_base_url": "https://memory.l3b.cc.cd",
    "cors_origins": ["https://memory.l3b.cc.cd"]
  }
}
