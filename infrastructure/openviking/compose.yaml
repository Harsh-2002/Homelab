services:
  openviking:
    image: ghcr.io/volcengine/openviking:v0.4.22
    container_name: openviking
    restart: unless-stopped
    environment:
      OPENVIKING_WITH_BOT: "1"
      OPENVIKING_PUBLIC_BASE_URL: https://memory.l3b.cc.cd
      OPENVIKING_ROOT_API_KEY: ${OPENVIKING_ROOT_API_KEY}
    ports:
      - "10.1.1.4:1933:1933"
    volumes:
      - /data/apps/openviking/state:/app/.openviking
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  ollama:
    image: ollama/ollama:0.34.4
    container_name: openviking-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - /data/apps/openviking/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
