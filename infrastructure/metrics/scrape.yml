global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: victoria
    basic_auth:
      username: metrics
      password_file: /etc/victoriametrics/api-password
    static_configs:
      - targets: ['10.1.1.7:8428']

  - job_name: proxmox-hosts
    static_configs:
      - targets: ['10.1.1.10:9100']
        labels:
          host: px10
      - targets: ['10.1.1.20:9100']
        labels:
          host: px20
      - targets: ['10.1.1.30:9100']
        labels:
          host: px30

  - job_name: data-hosts
    static_configs:
      - targets: ['10.1.1.4:9100']
        labels:
          host: ctr
      - targets: ['10.1.1.8:9100']
        labels:
          host: s3
      - targets: ['10.1.1.12:9100']
        labels:
          host: store

  - job_name: linux-guests
    static_configs:
      - targets: ['10.1.1.2:9100']
        labels:
          host: dns
      - targets: ['10.1.1.3:9100']
        labels:
          host: proxy
      - targets: ['10.1.1.5:9100']
        labels:
          host: dev
      - targets: ['10.1.1.6:9100']
        labels:
          host: auth
      - targets: ['10.1.1.7:9100']
        labels:
          host: beszel
      - targets: ['10.1.1.11:9100']
        labels:
          host: orva

  - job_name: proxmox-api
    metrics_path: /pve
    params:
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets: ['10.1.1.10', '10.1.1.20', '10.1.1.30']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '127.0.0.1:9221'
