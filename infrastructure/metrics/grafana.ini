[server]
http_addr = 10.1.1.7
http_port = 3000
domain = grafana.l3b.cc.cd
root_url = https://grafana.l3b.cc.cd/

[security]
disable_gravatar = true

[analytics]
reporting_enabled = false
check_for_updates = false

[users]
allow_sign_up = false

[auth.generic_oauth]
enabled = true
name = Pocket ID
allow_sign_up = true
client_id = grafana
scopes = openid profile email groups
auth_url = https://auth.l3b.cc.cd/authorize
token_url = https://auth.l3b.cc.cd/api/oidc/token
api_url = https://auth.l3b.cc.cd/api/oidc/userinfo
use_pkce = true
role_attribute_path = contains(groups[*], 'infrastructure-admins') && 'Admin' || 'Viewer'
role_attribute_strict = true
