name: arr

services:
  slskd:
    image: slskd/slskd:0.26.0
    container_name: slskd
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Kolkata
      SLSKD_UMASK: "007"
      SLSKD_SLSK_USERNAME: ${SOULSEEK_USERNAME:?required}
      SLSKD_SLSK_PASSWORD: ${SOULSEEK_PASSWORD:?required}
      SLSKD_USERNAME: ${SOULSEEK_USERNAME:?required}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD:?required}
      SLSKD_API_KEY: role=ReadWrite;${SLSKD_API_KEY:?required}
      SLSKD_REMOTE_CONFIGURATION: "false"
      SLSKD_NO_HTTPS: "true"
      SLSKD_SLSK_DNET_NO_CHILDREN: "true"
      SLSKD_DOWNLOADS_DIR: /data/downloads/soulseek/complete
      SLSKD_INCOMPLETE_DIR: /data/downloads/soulseek/incomplete
    volumes:
      - /data/apps/arr/slskd:/app
      - /mnt/AV/downloads/soulseek:/data/downloads/soulseek
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5030/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  soularr:
    image: ghcr.io/mrusse/soularr:1.2.2
    container_name: soularr
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      slskd:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Kolkata
      SCRIPT_INTERVAL: "300"
      WEBUI_ENABLED: "false"
      LIDARR_API_KEY: ${LIDARR_API_KEY:?required}
      SLSKD_API_KEY: ${SLSKD_API_KEY:?required}
    command:
      - /bin/sh
      - -c
      - |
        umask 077
        python -c 'import os,pathlib; text=pathlib.Path("/etc/soularr.ini").read_text(); text=text.replace("$${LIDARR_API_KEY}",os.environ["LIDARR_API_KEY"]).replace("$${SLSKD_API_KEY}",os.environ["SLSKD_API_KEY"]); pathlib.Path("/data/config.ini").write_text(text)'
        exec /app/run.sh
    volumes:
      - /data/apps/arr/soularr:/data
      - /data/apps/arr/soularr/template.ini:/etc/soularr.ini:ro
      - /mnt/AV/downloads/soulseek:/data/downloads/soulseek

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      UMASK: "007"
    ports:
      - 10.1.1.4:8686:8686
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1:8686/ping"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    volumes:
      - /data/apps/arr/lidarr:/config
      - /mnt/AV:/data

  readarr:
    image: ghcr.io/faustvii/readarr:0.10.0
    container_name: readarr
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      UMASK: "007"
    ports:
      - 10.1.1.4:8787:8787
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/ping"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    volumes:
      - /data/apps/arr/readarr:/config
      - /mnt/AV:/data

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.8
    container_name: cleanuparr
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      PORT: "11011"
      UMASK: "007"
    ports:
      - 10.1.1.4:11011:11011
    volumes:
      - /data/apps/arr/cleanuparr:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  unpackerr:
    image: golift/unpackerr:0.16.1
    container_name: unpackerr
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    environment:
      TZ: Asia/Kolkata
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY:?required}
      UN_RADARR_0_PATHS_0: /data/downloads/movies
      UN_RADARR_0_DELETE_ORIG: "false"
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY:?required}
      UN_SONARR_0_PATHS_0: /data/downloads/shows
      UN_LIDARR_0_URL: http://lidarr:8686
      UN_LIDARR_0_API_KEY: ${LIDARR_API_KEY:?required}
      UN_LIDARR_0_PATHS_0: /data/downloads/music
      UN_LIDARR_0_DELETE_ORIG: "false"
      UN_READARR_0_URL: http://readarr:8787
      UN_READARR_0_API_KEY: ${READARR_API_KEY:?required}
      UN_READARR_0_PATHS_0: /data/downloads/books
      UN_READARR_0_DELETE_ORIG: "false"
      UN_SONARR_0_DELETE_ORIG: "false"
      UN_PARALLEL: "1"
      UN_INTERVAL: 2m
      UN_START_DELAY: 1m
      UN_FILE_MODE: "0660"
      UN_DIR_MODE: "0770"
    volumes:
      - /data/apps/arr/unpackerr:/config
      - /mnt/AV/downloads:/data/downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
    ports:
      - 10.1.1.4:8989:8989
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - /data/apps/arr/sonarr:/config
      - /mnt/AV:/data

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
    ports:
      - 10.1.1.4:7878:7878
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - /data/apps/arr/radarr:/config
      - /mnt/AV:/data

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
    ports:
      - 10.1.1.4:9696:9696
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - /data/apps/arr/prowlarr:/config

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
    ports:
      - 10.1.1.4:6767:6767
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1:6767/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - /data/apps/arr/bazarr:/config
      - /mnt/AV/media:/data/media

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Kolkata
      PORT: "5055"
      LOG_LEVEL: info
    ports:
      - 10.1.1.4:5055:5055
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5055/api/v1/status',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - /data/apps/arr/seerr:/app/config

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      WEBUI_PORT: "8081"
      TORRENTING_PORT: "6881"
    ports:
      - 10.1.1.4:8081:8081
      - 10.1.1.4:6881:6881
      - 10.1.1.4:6881:6881/udp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - /data/apps/arr/qbittorrent:/config
      - /mnt/AV:/data
