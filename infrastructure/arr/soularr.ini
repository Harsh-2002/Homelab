[Lidarr]
api_key = ${LIDARR_API_KEY}
host_url = http://lidarr:8686
download_dir = /data/downloads/soulseek/complete
disable_sync = False

[Slskd]
api_key = ${SLSKD_API_KEY}
host_url = http://slskd:5030
url_base = /
download_dir = /data/downloads/soulseek/complete
delete_searches = True
stalled_timeout = 1800
remote_queue_timeout = 300

[Release Settings]
use_selected_lidarr_release = True
use_most_common_tracknum = True
allow_multi_disc = True
accepted_countries = India,Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
skip_region_check = False
accepted_formats = CD,Digital Media,Vinyl

[Search Settings]
search_timeout = 15000
maximum_peer_queue = 10
minimum_peer_upload_speed = 102400
minimum_filename_match_ratio = 0.85
minimum_search_interval = 10
allowed_filetypes = flac,mp3 320,mp3 256
ignored_users =
album_prepend_artist = True
search_type = incrementing_page
number_of_albums_to_grab = 1
title_blacklist =
search_blacklist =
search_source = missing
failed_import_denylist = True

[Download Settings]
download_filtering = True
use_extension_whitelist = True
extensions_whitelist = lrc

[Logging]
level = INFO
log_to_file = False
