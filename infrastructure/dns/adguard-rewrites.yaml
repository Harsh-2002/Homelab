# AdGuard Home rewrites, as live on 2026-11-17.
# smb is an exact A rewrite to the SMB host. A pass-through (self-CNAME) rule would
# send the query through the filter lists, and HaGeZi's list contains ||cc.cd^, which
# blocks the whole cc.cd domain and answers 0.0.0.0. Rewrites answer before filtering.
# Keep this file in sync with the live config.
rewrites:
  - domain: l3b.cc.cd
    answer: 10.1.1.10
    enabled: true
  - domain: '*.l3b.cc.cd'
    answer: l3b.cc.cd
    enabled: true
  - domain: smb.l3b.cc.cd
    answer: 10.1.1.10
    enabled: true
