name: minio

services:
  minio:
    container_name: minio
    hostname: minio
    image: firstfinger/minio@sha256:94c7aba0dbacd0ad6ddd2d50a86a4bab3c86b2e29926234359fb42c1429e35a6
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: https://minio-console.l3b.cc.cd
      CONSOLE_PBKDF_PASSPHRASE: ${CONSOLE_PBKDF_PASSPHRASE:?CONSOLE_PBKDF_PASSPHRASE is required}
      CONSOLE_PBKDF_SALT: ${CONSOLE_PBKDF_SALT:?CONSOLE_PBKDF_SALT is required}
    ports:
      - 10.1.1.4:9000:9000
      - 10.1.1.4:9001:9001
    volumes:
      - /data/minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
