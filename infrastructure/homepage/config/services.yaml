- Control:
    - AdGuard Home:
        icon: adguard-home.png
        href: https://dns.l3b.cc.cd
        description: DNS filtering and DNSSEC
        siteMonitor: http://adguard:3000/
        widget:
          type: adguard
          url: http://adguard:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
          fields: [queries, blocked, latency]
    - Pocket ID:
        icon: pocket-id.png
        href: https://auth.l3b.cc.cd
        description: Passkeys and identity
        siteMonitor: http://pocketid:1411/healthz
    - Tinyauth:
        icon: tinyauth.png
        href: https://login.l3b.cc.cd
        description: Access gate for every service
        siteMonitor: http://tinyauth:3000/
    - Portainer:
        icon: portainer.png
        href: https://portainer.l3b.cc.cd
        description: Docker stacks
        siteMonitor: http://portainer:9000/api/status
    - Beszel:
        icon: beszel.png
        href: https://beszel.l3b.cc.cd
        description: CPU, memory, disks and SMART
        siteMonitor: http://beszel:8090/
        widget:
          type: beszel
          url: http://beszel:8090
          username: "{{HOMEPAGE_VAR_BESZEL_USERNAME}}"
          password: "{{HOMEPAGE_VAR_BESZEL_PASSWORD}}"
          systemId: l3b
          version: 2
