global_defs {
    router_id px20
    enable_script_security
    script_user root
}

vrrp_script tailscale_health {
    script "/usr/local/libexec/check-tailscale"
    interval 2
    timeout 2
    fall 3
    rise 2
}

vrrp_instance tailscale_gateway {
    state BACKUP
    interface vmbr0
    virtual_router_id 51
    priority 120
    advert_int 1

    unicast_src_ip 10.1.1.20
    unicast_peer {
        10.1.1.10
        10.1.1.30
    }

    virtual_ipaddress {
        10.1.1.9/24 dev vmbr0
    }

    track_interface {
        tailscale0
    }

    track_script {
        tailscale_health
    }
}
