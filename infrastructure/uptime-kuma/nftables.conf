#!/usr/sbin/nft -f

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy accept;

		iifname "lo" tcp dport 3001 accept
		ip saddr 10.1.1.3 tcp dport 3001 accept
		tcp dport 3001 reject
	}

	chain forward {
		type filter hook forward priority filter; policy accept;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
