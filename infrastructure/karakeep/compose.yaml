services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.34.1
    container_name: karakeep
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    init: false
    environment:
      DATA_DIR: /data
      MEILI_ADDR: http://karakeep-meilisearch:7700
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      ASSET_STORE_S3_ENDPOINT: ${L3B_KARAKEEP_ASSET_STORE_S3_ENDPOINT}
      ASSET_STORE_S3_REGION: ${L3B_KARAKEEP_ASSET_STORE_S3_REGION}
      ASSET_STORE_S3_BUCKET: ${L3B_KARAKEEP_ASSET_STORE_S3_BUCKET}
      ASSET_STORE_S3_ACCESS_KEY_ID: ${L3B_KARAKEEP_ASSET_STORE_S3_ACCESS_KEY_ID}
      ASSET_STORE_S3_SECRET_ACCESS_KEY: ${L3B_KARAKEEP_ASSET_STORE_S3_SECRET_ACCESS_KEY}
      ASSET_STORE_S3_FORCE_PATH_STYLE: ${L3B_KARAKEEP_ASSET_STORE_S3_FORCE_PATH_STYLE}
      NEXTAUTH_URL: ${L3B_KARAKEEP_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${L3B_KARAKEEP_NEXTAUTH_SECRET}
      MEILI_MASTER_KEY: ${L3B_KARAKEEP_MEILI_MASTER_KEY}
      DISABLE_SIGNUPS: ${L3B_KARAKEEP_DISABLE_SIGNUPS}
      DB_WAL_MODE: ${L3B_KARAKEEP_DB_WAL_MODE}
      OAUTH_WELLKNOWN_URL: ${L3B_KARAKEEP_OAUTH_WELLKNOWN_URL}
      OAUTH_CLIENT_ID: ${L3B_KARAKEEP_OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${L3B_KARAKEEP_OAUTH_CLIENT_SECRET}
      OAUTH_PROVIDER_NAME: ${L3B_KARAKEEP_OAUTH_PROVIDER_NAME}
      OAUTH_SCOPE: ${L3B_KARAKEEP_OAUTH_SCOPE}
      OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: ${L3B_KARAKEEP_OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING}
    volumes:
    - /data/apps/karakeep/data:/data
    expose:
    - '3000'
    depends_on:
      karakeep-meilisearch:
        condition: service_started
      karakeep-chrome:
        condition: service_started
    networks:
    - l3b
  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    container_name: karakeep-chrome
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    init: true
    command:
    - --disable-gpu
    - --disable-dev-shm-usage
    - --hide-scrollbars
    - --disable-blink-features=AutomationControlled
    - --window-size=1440,900
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:9222/json/version
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
    - l3b
  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.56.1
    container_name: karakeep-meilisearch
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:7700/health
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
    - /data/apps/karakeep/meilisearch:/meili_data
    networks:
    - l3b
    environment:
      MEILI_MASTER_KEY: ${L3B_KARAKEEP_MEILISEARCH_MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: ${L3B_KARAKEEP_MEILISEARCH_MEILI_NO_ANALYTICS}
networks:
  l3b:
    external: true
    name: l3b
