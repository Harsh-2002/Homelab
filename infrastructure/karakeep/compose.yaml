name: karakeep

services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION}
    container_name: karakeep
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS}
      DB_WAL_MODE: ${DB_WAL_MODE}
      OAUTH_WELLKNOWN_URL: ${OAUTH_WELLKNOWN_URL}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH_SCOPE: ${OAUTH_SCOPE}
      OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: ${OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING}
      ASSET_STORE_S3_ENDPOINT: ${ASSET_STORE_S3_ENDPOINT}
      ASSET_STORE_S3_REGION: ${ASSET_STORE_S3_REGION}
      ASSET_STORE_S3_BUCKET: ${ASSET_STORE_S3_BUCKET}
      ASSET_STORE_S3_ACCESS_KEY_ID: ${ASSET_STORE_S3_ACCESS_KEY_ID}
      ASSET_STORE_S3_SECRET_ACCESS_KEY: ${ASSET_STORE_S3_SECRET_ACCESS_KEY}
      ASSET_STORE_S3_FORCE_PATH_STYLE: ${ASSET_STORE_S3_FORCE_PATH_STYLE}
    volumes:
      - /data/apps/karakeep/data:/data
    ports:
      - 10.1.1.4:3000:3000
    depends_on:
      meilisearch:
        condition: service_started
      chrome:
        condition: service_started

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    container_name: karakeep-chrome
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - /data/apps/karakeep/meilisearch:/meili_data
