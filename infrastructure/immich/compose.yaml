name: immich

x-immich-env: &immich-env
  IMMICH_HOST: 0.0.0.0
  TZ: ${TZ:?TZ is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_DATABASE_NAME: ${DB_DATABASE_NAME:?DB_DATABASE_NAME is required}
  DB_HOSTNAME: immich-postgres

services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      <<: *immich-env
      REDIS_HOSTNAME: immich-redis
      FFMPEG_HWACCEL: qsv
    ports:
      - 10.1.1.4:2283:2283
    volumes:
      - /data/immich/media:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    environment:
      <<: *immich-env
      MACHINE_LEARNING_DEVICE: CPU
      MACHINE_LEARNING_PROVIDER: openvino
    volumes:
      - /data/immich/model:/cache
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  immich-postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      TZ: ${TZ:?TZ is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - /data/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
    restart: unless-stopped
