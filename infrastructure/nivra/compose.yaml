services:
  nivra:
    image: ghcr.io/harsh-2002/nivra:latest@sha256:fdcb28a35356ab57257ab4e9ffc705840913dcb64bf6f2cb6ddeca3391ad781d
    container_name: nivra
    restart: unless-stopped
    init: true
    ports:
      - "10.1.1.4:3020:3000"
    environment:
      NIVRA_DATA_DIR: /data
      NIVRA_PUBLIC_URL: https://notes.l3b.cc.cd
      NIVRA_ENCRYPTION_ENABLED: "false"
    volumes:
      - /data/apps/nivra:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
