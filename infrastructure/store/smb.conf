[global]
   server role = standalone server
   workgroup = WORKGROUP
   server min protocol = SMB3_00
   server signing = mandatory
   disable netbios = yes
   smb ports = 445
   map to guest = never
   load printers = no
   printing = bsd
   printcap name = /dev/null

[files]
   path = /srv/files/data
   browseable = yes
   read only = no
   guest ok = no
   valid users = iam.anuragvishwakarma
   create mask = 0660
   directory mask = 0770
