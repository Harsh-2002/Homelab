argo-cd:
  configs:
    cm:
      url: https://argocd.l3b.cc.cd
      webhook.maxPayloadSizeMB: "1"
      oidc.config: |
        name: Pocket ID
        issuer: https://auth.l3b.cc.cd
        clientID: argocd
        clientSecret: $pocketid-oidc:clientSecret
        requestedScopes:
          - openid
          - profile
          - email
          - groups
      accounts.iam-anuragvishwakarma: login
      accounts.homepage: apiKey
      admin.enabled: false
      exec.enabled: false
    secret:
      extra:
        webhook.github.secret: $argocd-github-webhook:secret
    params:
      server.insecure: true
    rbac:
      policy.csv: |
        g, iam-anuragvishwakarma, role:admin
        g, infrastructure-admins, role:admin
        g, homepage, role:readonly

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  server:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: 10.1.1.171

  repoServer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  applicationSet:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  notifications:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi
