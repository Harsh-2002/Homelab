apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smoke
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Harsh-2002/Homelab.git
    targetRevision: main
    path: gitops/apps/smoke
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-smoke
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
