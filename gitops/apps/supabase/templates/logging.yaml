apiVersion: v1
kind: Namespace
metadata:
  name: supabase-prod-logging
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: supabase-prod-vector
  namespace: supabase-prod-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: supabase-prod-vector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: supabase-prod-vector
subjects:
  - kind: ServiceAccount
    name: supabase-prod-vector
    namespace: supabase-prod-logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: supabase-prod-vector
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-prod-vector
  namespace: supabase-prod-logging
data:
  vector.yaml: |
{{ .Files.Get "files/vector.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: supabase-prod-vector
  namespace: supabase-prod-logging
spec:
  selector:
    matchLabels:
      app: supabase-prod-vector
  template:
    metadata:
      labels:
        app: supabase-prod-vector
    spec:
      serviceAccountName: supabase-prod-vector
      containers:
        - name: vector
          image: timberio/vector:0.53.0-alpine
          args: [--config, /etc/vector/vector.yaml]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOGFLARE_PUBLIC_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: supabase-prod-vector
                  key: publicAccessToken
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: logs
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: supabase-prod-vector
        - name: logs
          hostPath:
            path: /var/log
            type: Directory
        - name: state
          emptyDir: {}
