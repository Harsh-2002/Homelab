apiVersion: batch/v1
kind: Job
metadata:
  name: supabase-observability-init-v5
  namespace: supabase-prod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 100
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: supabase/postgres:17.6.1.136
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              until psql -Atc "SELECT count(*) FROM homelab_bootstrap.platform_migrations WHERE version='v3-official-init-overlays'" 2>/dev/null | grep -qx 1; do sleep 3; done
              psql -v ON_ERROR_STOP=1 -f /seed/ensure-observability.sql >/dev/null
              echo 'Studio Query Performance extension and callable statistics verified'
          env:
            - name: PGHOST
              value: supabase-db-rw
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGSSLMODE
              value: require
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: supabase-prod-db
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed
          configMap:
            name: supabase-prod-seed-sql
