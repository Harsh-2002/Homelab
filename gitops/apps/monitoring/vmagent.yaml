apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-vmagent
rules:
  - apiGroups: ['']
    resources: [nodes, pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [nodes/metrics, nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-vmagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-vmagent
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-scrape
  namespace: monitoring
data:
  scrape.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
    scrape_configs:
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc:8080']
      - job_name: kubelet
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        scrape_interval: 60s
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_fs_usage_bytes|container_fs_limit_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total'
            action: keep
      - job_name: longhorn
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [longhorn-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: longhorn-backend
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: manager
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: vmagent
        static_configs:
          - targets: ['127.0.0.1:8429']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmagent
  template:
    metadata:
      labels:
        app: vmagent
    spec:
      serviceAccountName: vmagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.152.0
          args:
            - -promscrape.config=/etc/vmagent/scrape.yml
            - -remoteWrite.url=https://metrics.l3b.cc.cd/api/v1/write
            - -remoteWrite.basicAuth.username=metrics
            - -remoteWrite.basicAuth.passwordFile=/etc/vmagent/auth/password
            - -remoteWrite.tmpDataPath=/var/lib/vmagent
            - -remoteWrite.maxDiskUsagePerURL=512MiB
            - -httpListenAddr=:8429
          volumeMounts:
            - name: scrape
              mountPath: /etc/vmagent/scrape.yml
              subPath: scrape.yml
              readOnly: true
            - name: auth
              mountPath: /etc/vmagent/auth
              readOnly: true
            - name: queue
              mountPath: /var/lib/vmagent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8429
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: scrape
          configMap:
            name: vmagent-scrape
        - name: auth
          secret:
            secretName: vmagent-remote-write
            defaultMode: 0440
        - name: queue
          emptyDir:
            sizeLimit: 1Gi
