        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: supabase-prod
              app.kubernetes.io/name: supabase-analytics
          topologyKey: kubernetes.io/hostname
    readinessProbe:
      tcpSocket:
        port: 4000
      periodSeconds: 10
      timeoutSeconds: 3
