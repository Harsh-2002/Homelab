      tcpSocket:
        port: 9000
      periodSeconds: 5
      failureThreshold: 60
  imgproxy:
    enabled: true
    fullnameOverride: supabase-prod-imgproxy
    replicaCount: 2
    automountServiceAccountToken: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
