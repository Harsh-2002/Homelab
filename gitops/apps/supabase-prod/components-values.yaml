ingress:
  enabled: false
secret:
  jwt:
    secretRef: supabase-prod-jwt
  apikey:
    secretRef: supabase-prod-apikey
  db:
    secretRef: supabase-prod-db
    host: supabase-db-rw.supabase-prod.svc.cluster.local
    port: '5432'
  analytics:
    secretRef: supabase-prod-analytics
  bigquery:
    secretRef: supabase-prod-bigquery
  smtp:
    secretRef: supabase-prod-smtp
  dashboard:
    secretRef: supabase-prod-dashboard
  s3:
    secretRef: supabase-prod-s3
  realtime:
    secretRef: supabase-prod-realtime
  meta:
    secretRef: supabase-prod-meta
  minio:
    secretRef: supabase-prod-s3
    secretRefKey:
      user: keyId
      password: accessKey
deployment:
  analytics:
    enabled: true
    fullnameOverride: supabase-prod-analytics
    replicaCount: 2
    automountServiceAccountToken: false
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 1Gi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
