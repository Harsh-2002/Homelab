apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: supabase-prod-ingress
  namespace: supabase-prod
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: supabase-prod-logging
      ports:
        - protocol: TCP
          port: 4000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: supabase-prod-caddy-gateway
  namespace: supabase-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: supabase-kong
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.1.1.3/32
      ports:
        - protocol: TCP
          port: 8000
