apiVersion: v1
kind: Service
metadata:
  name: supabase-prod-gateway
  namespace: supabase-prod
  annotations:
    lbipam.cilium.io/ips: 10.1.1.175
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/instance: supabase-prod
    app.kubernetes.io/name: supabase-kong
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-prod-realtime-headless
  namespace: supabase-prod
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 4000
  selector:
    app.kubernetes.io/instance: supabase-prod
    app.kubernetes.io/name: supabase-realtime
