apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: supabase-db
  namespace: supabase-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 3
  imageName: supabase/postgres:17.6.1.136
  postgresUID: 100
  postgresGID: 101
  enableSuperuserAccess: true
  superuserSecret:
    name: supabase-prod-superuser
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  failoverDelay: 5
  smartShutdownTimeout: 60
  stopDelay: 90
  startDelay: 300
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 2Gi
  storage:
    storageClass: longhorn
    size: 30Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  replicationSlots:
    highAvailability:
      enabled: true
      synchronizeLogicalDecoding: true
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
    shared_preload_libraries:
      - pg_stat_statements
      - pgaudit
      - plpgsql
      - plpgsql_check
      - pg_cron
      - pg_net
      - pgsodium
      - auto_explain
      - pg_tle
      - plan_filter
      - supabase_vault
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      wal_level: logical
      max_replication_slots: "20"
      max_wal_senders: "20"
      max_slot_wal_keep_size: 2GB
      hot_standby_feedback: "on"
      sync_replication_slots: "on"
      cron.database_name: postgres
      pgsodium.getkey_script: /projected/getkey.sh
      session_preload_libraries: supautils
    pg_hba:
      - host all all 10.244.0.0/16 scram-sha-256
  projectedVolumeTemplate:
    defaultMode: 0444
    sources:
      - secret:
          name: supabase-prod-pgsodium
          items:
            - key: root.key
              path: root.key
      - configMap:
          name: supabase-prod-postgres-scripts
          items:
            - key: getkey.sh
              path: getkey.sh
              mode: 0555
  bootstrap:
    initdb:
      database: bootstrap
      owner: bootstrap
      dataChecksums: true
      postInitSQL:
        - CREATE ROLE supabase_admin WITH SUPERUSER CREATEDB CREATEROLE REPLICATION BYPASSRLS LOGIN;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-prod-postgres-scripts
  namespace: supabase-prod
data:
  getkey.sh: |
    #!/bin/sh
    set -eu
    cat /projected/root.key
