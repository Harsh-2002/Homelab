apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-prod-analytics
  namespace: supabase-prod
  labels:
    helm.sh/chart: supabase-0.8.0
    app.kubernetes.io/name: supabase
    app.kubernetes.io/instance: supabase-prod
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: supabase-analytics
      app.kubernetes.io/instance: supabase-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supabase-analytics
        app.kubernetes.io/instance: supabase-prod
    spec:
      serviceAccountName: supabase-prod-analytics
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: supabase-prod
                app.kubernetes.io/name: supabase-analytics
            topologyKey: kubernetes.io/hostname
      initContainers:
      - name: init-db
        image: postgres:17-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: supabase-db-rw.supabase-prod.svc.cluster.local
        - name: DB_PORT
          value: '5432'
        command:
        - /bin/sh
        - -c
        args:
        - 'until pg_isready -h $(DB_HOST) -p $(DB_PORT) -U postgres; do

          echo "Waiting for database to start..."

          sleep 2

          done

          '
        - echo "Database is ready"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      containers:
      - name: supabase-analytics
        image: supabase/logflare:1.50.10
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
          protocol: TCP
        env:
        - name: DB_DRIVER
          value: postgresql
        - name: DB_USERNAME
          value: supabase_admin
        - name: DB_DATABASE
          value: _supabase
        - name: DB_HOSTNAME
          value: supabase-db-rw.supabase-prod.svc.cluster.local
        - name: DB_PORT
          value: '5432'
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-prod-db
              key: password
        - name: DB_PASSWORD_ENC
          valueFrom:
            secretKeyRef:
              name: supabase-prod-db
              key: password
        - name: LOGFLARE_PUBLIC_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: supabase-prod-analytics
              key: publicAccessToken
        - name: LOGFLARE_PRIVATE_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: supabase-prod-analytics
              key: privateAccessToken
        - name: POSTGRES_BACKEND_URL
          value: $(DB_DRIVER)://$(DB_USERNAME):$(DB_PASSWORD_ENC)@$(DB_HOSTNAME):$(DB_PORT)/$(DB_DATABASE)?ssl=true
        - name: LOGFLARE_NODE_HOST
          value: 127.0.0.1
        - name: DB_SCHEMA
          value: _analytics
        - name: POSTGRES_BACKEND_SCHEMA
          value: _analytics
        - name: LOGFLARE_SINGLE_TENANT
          value: 'true'
        - name: LOGFLARE_SUPABASE_MODE
          value: 'true'
        - name: LOGFLARE_FEATURE_FLAG_OVERRIDE
          value: multibackend=true
        - name: ERL_FLAGS
          value: +S 2:2
        - name: PGSSLROOTCERT
          value: /etc/supabase-tls/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/supabase-tls/ca.crt
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 384Mi
        readinessProbe:
          periodSeconds: 10
          tcpSocket:
            port: 4000
          timeoutSeconds: 3
        startupProbe:
          failureThreshold: 60
          periodSeconds: 5
          tcpSocket:
            port: 4000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: postgres-ca
          mountPath: /etc/supabase-tls
          readOnly: true
      volumes:
      - name: postgres-ca
        secret:
          secretName: supabase-db-ca
          items:
          - key: ca.crt
            path: ca.crt
---
