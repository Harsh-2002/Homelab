apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-prod-kong
  labels:
    helm.sh/chart: supabase-0.8.0
    app.kubernetes.io/name: supabase
    app.kubernetes.io/instance: supabase-prod
    app.kubernetes.io/managed-by: Helm
  namespace: supabase-prod
data:
  kong-entrypoint.sh: "#!/bin/sh\n\n# Export empty optional keys so awk removes their\
    \ placeholders in legacy mode.\nexport SUPABASE_PUBLISHABLE_KEY=\"${SUPABASE_PUBLISHABLE_KEY:-}\"\
    \nexport SUPABASE_SECRET_KEY=\"${SUPABASE_SECRET_KEY:-}\"\n\nif [ -n \"${SUPABASE_SECRET_KEY:-}\"\
    \ ] && [ -n \"${SUPABASE_PUBLISHABLE_KEY:-}\" ]; then\n  export LUA_AUTH_EXPR=\"\
    \\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer\
    \ sb_' and headers.authorization) or (headers.apikey == '${SUPABASE_SECRET_KEY}'\
    \ and 'Bearer ${SERVICE_ROLE_KEY_ASYMMETRIC}') or (headers.apikey == '${SUPABASE_PUBLISHABLE_KEY}'\
    \ and 'Bearer ${ANON_KEY_ASYMMETRIC}') or headers.apikey)\"\n  export LUA_RT_WS_EXPR=\"\
    \\$((query_params.apikey == '${SUPABASE_SECRET_KEY}' and '${SERVICE_ROLE_KEY_ASYMMETRIC}')\
    \ or (query_params.apikey == '${SUPABASE_PUBLISHABLE_KEY}' and '${ANON_KEY_ASYMMETRIC}')\
    \ or query_params.apikey)\"\nelse\n  export LUA_AUTH_EXPR=\"\\$((headers.authorization\
    \ ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization)\
    \ or headers.apikey)\"\n  export LUA_RT_WS_EXPR=\"\\$(query_params.apikey)\"\n\
    fi\n\necho \"Replacing env placeholders of ${KONG_DECLARATIVE_CONFIG}\"\n\n# Substitute\
    \ once, preserving YAML quoting, Lua expressions and literal values\n# containing\
    \ sed replacement characters. Use the upstream $VAR syntax and\n# leave unknown\
    \ variables unchanged.\nawk '{\n  result = \"\"\n  rest = $0\n  while (match(rest,\
    \ /\\$[A-Za-z_][A-Za-z_0-9]*/)) {\n    varname = substr(rest, RSTART + 1, RLENGTH\
    \ - 1)\n    if (varname in ENVIRON) {\n      result = result substr(rest, 1, RSTART\
    \ - 1) ENVIRON[varname]\n    } else {\n      result = result substr(rest, 1, RSTART\
    \ + RLENGTH - 1)\n    }\n    rest = substr(rest, RSTART + RLENGTH)\n  }\n  print\
    \ result rest\n}' /usr/local/kong/template.yml > \"$KONG_DECLARATIVE_CONFIG\"\n\
    \nsed -i '/^[[:space:]]*- key:[[:space:]]*$/d' \"$KONG_DECLARATIVE_CONFIG\"\n\n\
    exec /entrypoint.sh kong docker-start\n"
  kong.yml: "_format_version: '2.1'\n_transform: true\n\nconsumers:\n  - username:\
    \ DASHBOARD\n  - username: anon\n    keyauth_credentials:\n        - key: $SUPABASE_ANON_KEY\n\
    \        - key: $SUPABASE_PUBLISHABLE_KEY\n  - username: service_role\n    keyauth_credentials:\n\
    \        - key: $SUPABASE_SERVICE_KEY\n        - key: $SUPABASE_SECRET_KEY\nacls:\n\
    \  - consumer: anon\n    group: anon\n  - consumer: service_role\n    group: admin\n\
    basicauth_credentials:\n  - consumer: DASHBOARD\n    username: '$DASHBOARD_USERNAME'\n\
    \    password: '$DASHBOARD_PASSWORD'\nservices:\n  - name: auth-v1-open\n    url:\
    \ http://supabase-prod-auth:9999/verify\n    routes:\n      - name: auth-v1-open\n\
    \        strip_path: true\n        paths:\n          - /auth/v1/verify\n    plugins:\n\
    \      - name: cors\n  - name: auth-v1-open-callback\n    url: http://supabase-prod-auth:9999/callback\n\
    \    routes:\n      - name: auth-v1-open-callback\n        strip_path: true\n\
    \        paths:\n          - /auth/v1/callback\n    plugins:\n      - name: cors\n\
    \  - name: auth-v1-open-authorize\n    url: http://supabase-prod-auth:9999/authorize\n\
    \    routes:\n      - name: auth-v1-open-authorize\n        strip_path: true\n\
    \        paths:\n          - /auth/v1/authorize\n    plugins:\n      - name: cors\n\
    \  - name: auth-v1-open-jwks\n    url: http://supabase-prod-auth:9999/.well-known/jwks.json\n\
    \    routes:\n      - name: auth-v1-open-jwks\n        strip_path: true\n    \
    \    paths:\n          - /auth/v1/.well-known/jwks.json\n    plugins:\n      -\
    \ name: cors\n  - name: well-known-oauth\n    _comment: 'Auth: /.well-known/oauth-authorization-server\
    \ -> http://supabase-prod-auth:9999/.well-known/oauth-authorization-server'\n\
    \    url: http://supabase-prod-auth:9999/.well-known/oauth-authorization-server\n\
    \    routes:\n      - name: well-known-oauth\n        strip_path: true\n     \
    \   paths:\n          - /.well-known/oauth-authorization-server\n    plugins:\n\
    \      - name: cors\n\n  - name: auth-v1-open-sso-acs\n    url: http://supabase-prod-auth:9999/sso/saml/acs\n\
    \    routes:\n      - name: auth-v1-open-sso-acs\n        strip_path: true\n \
    \       paths:\n          - /auth/v1/sso/saml/acs\n    plugins:\n      - name:\
    \ cors\n  - name: auth-v1-open-sso-metadata\n    url: http://supabase-prod-auth:9999/sso/saml/metadata\n\
    \    routes:\n      - name: auth-v1-open-sso-metadata\n        strip_path: true\n\
    \        paths:\n          - /auth/v1/sso/saml/metadata\n    plugins:\n      -\
    \ name: cors\n  - name: auth-v1\n    _comment: \"GoTrue: /auth/v1/* -> http://supabase-prod-auth:9999/*\"\
    \n    url: http://supabase-prod-auth:9999/\n    routes:\n      - name: auth-v1-all\n\
    \        strip_path: true\n        paths:\n          - /auth/v1/\n    plugins:\n\
    \      - name: cors\n      - name: key-auth\n        config:\n          hide_credentials:\
    \ false\n      - name: request-transformer\n        config:\n          add:\n\
    \            headers:\n              - \"Authorization: $LUA_AUTH_EXPR\"\n   \
    \       replace:\n            headers:\n              - \"Authorization: $LUA_AUTH_EXPR\"\
    \n      - name: acl\n        config:\n          hide_groups_header: true\n   \
    \       allow:\n            - admin\n            - anon\n  # Restrict the PostgREST\
    \ OpenAPI root to admin consumers.\n  - name: rest-v1-openapi\n    _comment: 'PostgREST\
    \ OpenAPI root: /rest/v1/ -> <http://supabase-prod-rest:3000/> (admin only). See\
    \ <https://github.com/orgs/supabase/discussions/42949>'\n    url: http://supabase-prod-rest:3000/\n\
    \    routes:\n      - name: rest-v1-openapi-root\n        strip_path: true\n \
    \       expression: 'http.path == \"/rest/v1/\"'\n    plugins:\n      - name:\
    \ cors\n      - name: key-auth\n        config:\n          hide_credentials: false\n\
    \      - name: request-transformer\n        config:\n          add:\n        \
    \    headers:\n              - \"Authorization: $LUA_AUTH_EXPR\"\n          replace:\n\
    \            headers:\n              - \"Authorization: $LUA_AUTH_EXPR\"\n   \
    \   - name: acl\n        config:\n          hide_groups_header: true\n       \
    \   allow:\n            - admin\n\n  - name: rest-v1\n    _comment: \"PostgREST:\
    \ /rest/v1/* -> http://supabase-prod-rest:3000/*\"\n    url: http://supabase-prod-rest:3000/\n\
    \    routes:\n      - name: rest-v1-all\n        strip_path: true\n        paths:\n\
    \          - /rest/v1/\n    plugins:\n      - name: cors\n      - name: key-auth\n\
    \        config:\n          hide_credentials: false\n      - name: request-transformer\n\
    \        config:\n          add:\n            headers:\n              - \"Authorization:\
    \ $LUA_AUTH_EXPR\"\n          replace:\n            headers:\n              -\
    \ \"Authorization: $LUA_AUTH_EXPR\"\n      - name: acl\n        config:\n    \
    \      hide_groups_header: true\n          allow:\n            - admin\n     \
    \       - anon\n  - name: graphql-v1\n    _comment: 'PostgREST: /graphql/v1/*\
    \ -> http://supabase-prod-rest:3000/rpc/graphql'\n    url: http://supabase-prod-rest:3000/rpc/graphql\n\
    \    routes:\n      - name: graphql-v1-all\n        strip_path: true\n       \
    \ paths:\n          - /graphql/v1\n    plugins:\n      - name: cors\n      - name:\
    \ key-auth\n        config:\n          hide_credentials: false\n      - name:\
    \ request-transformer\n        config:\n          add:\n            headers:\n\
    \              - \"Content-Profile: graphql_public\"\n              - \"Authorization:\
    \ $LUA_AUTH_EXPR\"\n          replace:\n            headers:\n              -\
    \ \"Authorization: $LUA_AUTH_EXPR\"\n      - name: acl\n        config:\n    \
    \      hide_groups_header: true\n          allow:\n            - admin\n     \
    \       - anon\n  - name: realtime-v1-ws\n    _comment: \"Realtime: /realtime/v1/*\
    \ -> ws://supabase-prod-realtime:4000/socket/*\"\n    url: http://supabase-prod-realtime:4000/socket\n\
    \    protocol: ws\n    routes:\n      - name: realtime-v1-ws\n        strip_path:\
    \ true\n        paths:\n          - /realtime/v1/\n    plugins:\n      - name:\
    \ cors\n      - name: key-auth\n        config:\n          hide_credentials: false\n\
    \      - name: request-transformer\n        config:\n          add:\n        \
    \    headers:\n              - \"x-api-key:$LUA_RT_WS_EXPR\"\n          replace:\n\
    \            querystring:\n              - \"apikey:$LUA_RT_WS_EXPR\"\n      -\
    \ name: acl\n        config:\n          hide_groups_header: true\n          allow:\n\
    \            - admin\n            - anon\n  # Block Realtime management endpoints.\n\
    \  - name: realtime-v1-rest-openapi\n    _comment: 'Block access to the Realtime\
    \ OpenAPI endpoint'\n    url: http://supabase-prod-realtime:4000/api/openapi\n\
    \    protocol: http\n    routes:\n      - name: realtime-v1-rest-openapi\n   \
    \     strip_path: true\n        paths:\n          - /realtime/v1/api/openapi\n\
    \    plugins:\n      - name: request-termination\n        config:\n          status_code:\
    \ 403\n          message: \"Access is forbidden.\"\n\n  # Block access to /realtime/v1/api/tenants\n\
    \  - name: realtime-v1-rest-tenants\n    _comment: 'Block access to Realtime tenant\
    \ management'\n    url: http://supabase-prod-realtime:4000/api/tenants\n    protocol:\
    \ http\n    routes:\n      - name: realtime-v1-rest-tenants\n        strip_path:\
    \ true\n        paths:\n          - /realtime/v1/api/tenants\n    plugins:\n \
    \     - name: request-termination\n        config:\n          status_code: 403\n\
    \          message: \"Access is forbidden.\"\n\n  - name: realtime-v1-rest\n \
    \   _comment: 'Realtime: /realtime/v1/api/* -> http://supabase-prod-realtime:4000/api/*'\n\
    \    url: http://supabase-prod-realtime:4000/api\n    protocol: http\n    routes:\n\
    \      - name: realtime-v1-rest\n        strip_path: true\n        paths:\n  \
    \        - /realtime/v1/api\n    plugins:\n      - name: cors\n      - name: key-auth\n\
    \        config:\n          hide_credentials: false\n      - name: request-transformer\n\
    \        config:\n          add:\n            headers:\n              - \"Authorization:\
    \ $LUA_AUTH_EXPR\"\n          replace:\n            headers:\n              -\
    \ \"Authorization: $LUA_AUTH_EXPR\"\n      - name: acl\n        config:\n    \
    \      hide_groups_header: true\n          allow:\n            - admin\n     \
    \       - anon\n  - name: storage-v1\n    _comment: \"Storage: /storage/v1/* ->\
    \ http://supabase-prod-storage:5000/*\"\n    url: http://supabase-prod-storage:5000/\n\
    \    routes:\n      - name: storage-v1-all\n        strip_path: true\n       \
    \ paths:\n          - /storage/v1/\n    plugins:\n      - name: cors\n      -\
    \ name: request-transformer\n        config:\n          add:\n            headers:\n\
    \              - \"Authorization: $LUA_AUTH_EXPR\"\n          replace:\n     \
    \       headers:\n              - \"Authorization: $LUA_AUTH_EXPR\"\n      - name:\
    \ post-function\n        config:\n          access:\n            - |\n       \
    \       local auth = kong.request.get_header(\"authorization\")\n            \
    \  if auth == nil or auth == \"\" or auth:find(\"^%s*$\") then\n             \
    \   kong.service.request.clear_header(\"authorization\")\n              end\n\
    \  - name: functions-v1\n    _comment: 'Edge Functions: /functions/v1/* -> http://supabase-prod-functions:9000/*'\n\
    \    url: http://supabase-prod-functions:9000/\n    read_timeout: 150000\n   \
    \ routes:\n      - name: functions-v1-all\n        strip_path: true\n        paths:\n\
    \          - /functions/v1/\n    plugins:\n      - name: cors\n\n\n\n\n  - name:\
    \ meta\n    _comment: \"pg-meta: /pg/* -> http://supabase-prod-meta:8080/*\"\n\
    \    url: http://supabase-prod-meta:8080/\n    routes:\n      - name: meta-all\n\
    \        strip_path: true\n        paths:\n          - /pg/\n    plugins:\n  \
    \    - name: key-auth\n        config:\n          hide_credentials: false\n  \
    \    - name: acl\n        config:\n          hide_groups_header: true\n      \
    \    allow:\n            - admin\n  # Block both MCP entry points by default.\n\
    \  - name: mcp-blocker\n    _comment: 'Block direct access to /api/mcp'\n    url:\
    \ http://supabase-prod-studio:3000/api/mcp\n    routes:\n      - name: mcp-blocker-route\n\
    \        strip_path: true\n        paths:\n          - /api/mcp\n    plugins:\n\
    \      - name: request-termination\n        config:\n          status_code: 403\n\
    \          message: \"Access is forbidden.\"\n\n  ## MCP endpoint - blocked by\
    \ default\n  - name: mcp\n    _comment: 'Block access to MCP through the public\
    \ gateway'\n    url: http://supabase-prod-studio:3000/api/mcp\n    routes:\n \
    \     - name: mcp\n        strip_path: true\n        paths:\n          - /mcp\n\
    \    plugins:\n      # Block access to /mcp by default\n      - name: request-termination\n\
    \        config:\n          status_code: 403\n          message: \"Access is forbidden.\"\
    \n  - name: dashboard\n    _comment: 'Studio: /* -> http://supabase-prod-studio:3000/*'\n\
    \    url: http://supabase-prod-studio:3000/\n    routes:\n      - name: dashboard-all\n\
    \        strip_path: true\n        paths:\n          - /\n    plugins:\n     \
    \ - name: cors\n      - name: basic-auth\n        config:\n          hide_credentials:\
    \ true\n"
