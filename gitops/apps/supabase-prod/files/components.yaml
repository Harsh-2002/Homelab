        - name: POSTGRES_HOST
          value: supabase-db-rw.supabase-prod.svc.cluster.local
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-prod-db
              key: password
        - name: PG_META_CRYPTO_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-prod-meta
              key: cryptoKey
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-prod-dashboard
              key: openAiApiKey
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-prod-jwt
              key: anonKey
        - name: SUPABASE_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-prod-jwt
              key: serviceKey
        - name: AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-prod-jwt
              key: secret
        - name: ENABLED_FEATURES_LOGS_ALL
          value: 'false'
        - name: EDGE_FUNCTIONS_MANAGEMENT_FOLDER
          value: /home/deno/functions
        - name: SNIPPETS_MANAGEMENT_FOLDER
          value: /app/snippets
        - name: HOSTNAME
          value: '::'
        - name: STUDIO_PORT
          value: '3000'
        - name: DEFAULT_ORGANIZATION_NAME
          value: Homelab
        - name: DEFAULT_PROJECT_NAME
          value: Production
        - name: SUPABASE_PUBLIC_URL
          value: https://sb-prod.l3b.cc.cd
        - name: NEXT_ANALYTICS_BACKEND_PROVIDER
          value: postgres
        - name: PGSSLROOTCERT
          value: /etc/supabase-tls/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/supabase-tls/ca.crt
        resources:
          limits:
            memory: 768Mi
          requests:
            cpu: 50m
            memory: 256Mi
        volumeMounts:
        - name: functions-storage
          mountPath: /home/deno/functions
        - name: snippets-storage
          mountPath: /app/snippets
        - name: postgres-ca
          mountPath: /etc/supabase-tls
          readOnly: true
        readinessProbe:
          periodSeconds: 10
          tcpSocket:
            port: 3000
          timeoutSeconds: 3
        startupProbe:
          failureThreshold: 60
          periodSeconds: 5
          tcpSocket:
            port: 3000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: functions-storage
        persistentVolumeClaim:
          claimName: supabase-prod-functions
      - name: snippets-storage
        persistentVolumeClaim:
          claimName: supabase-prod-snippets
      - name: postgres-ca
        secret:
          secretName: supabase-db-ca
          items:
          - key: ca.crt
            path: ca.crt
