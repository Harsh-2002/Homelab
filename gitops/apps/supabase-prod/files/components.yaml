apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-prod-functions
  namespace: supabase-prod
  labels:
    helm.sh/chart: supabase-0.8.0
    app.kubernetes.io/name: supabase
    app.kubernetes.io/instance: supabase-prod
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: supabase-functions
      app.kubernetes.io/instance: supabase-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supabase-functions
        app.kubernetes.io/instance: supabase-prod
      annotations:
        checksum/config: 635ecfff85d5a162c4ed2dcfa180909d3607040b35225c207d913d6be201481d
    spec:
      serviceAccountName: supabase-prod-functions
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: supabase-prod
                app.kubernetes.io/name: supabase-functions
            topologyKey: kubernetes.io/hostname
      containers:
      - name: supabase-functions
        image: supabase/edge-runtime:v1.76.2
        imagePullPolicy: IfNotPresent
        args:
        - start
        - --main-service
        - /home/deno/functions/main
        env:
        - name: SUPABASE_URL
          value: http://supabase-prod-kong:8000
        - name: DB_DRIVER
          value: postgresql
        - name: DB_USERNAME
          value: postgres
        - name: DB_SSL
          value: verify-full
        - name: DB_HOSTNAME
          value: supabase-db-rw.supabase-prod.svc.cluster.local
        - name: DB_PORT
          value: '5432'
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-prod-db
              key: password
        - name: DB_PASSWORD_ENC
          valueFrom:
            secretKeyRef:
              name: supabase-prod-db
              key: password
        - name: DB_DATABASE
          value: postgres
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-prod-jwt
              key: secret
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-prod-jwt
              key: anonKey
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-prod-jwt
              key: serviceKey
        - name: SUPABASE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-prod-apikey
              key: publishableKey
        - name: SUPABASE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-prod-apikey
              key: secretKey
        - name: SUPABASE_PUBLISHABLE_KEYS
          value: '{"default":"$(SUPABASE_PUBLISHABLE_KEY)"}'
        - name: SUPABASE_SECRET_KEYS
          value: '{"default":"$(SUPABASE_SECRET_KEY)"}'
        - name: SUPABASE_DB_URL
          value: $(DB_DRIVER)://$(DB_USERNAME):$(DB_PASSWORD_ENC)@$(DB_HOSTNAME):$(DB_PORT)/$(DB_DATABASE)?search_path=auth&sslmode=$(DB_SSL)
        - name: VERIFY_JWT
          value: 'true'
        - name: PGSSLROOTCERT
          value: /etc/supabase-tls/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/supabase-tls/ca.crt
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - name: functions-storage
          mountPath: /home/deno/functions
        - mountPath: /home/deno/functions/main/index.ts
          name: functions-main
          subPath: index.ts
        - name: postgres-ca
          mountPath: /etc/supabase-tls
          readOnly: true
        readinessProbe:
          periodSeconds: 10
          tcpSocket:
            port: 9000
          timeoutSeconds: 3
        startupProbe:
          failureThreshold: 60
          periodSeconds: 5
          tcpSocket:
            port: 9000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: functions-storage
        persistentVolumeClaim:
          claimName: supabase-prod-functions
      - name: functions-main
        configMap:
          name: supabase-prod-functions-main
      - name: postgres-ca
        secret:
          secretName: supabase-db-ca
          items:
          - key: ca.crt
            path: ca.crt
