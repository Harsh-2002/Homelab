apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  settings.yaml: |
    title: l3b.cc.cd
    description: Private infrastructure console
    theme: dark
    color: cyan
    headerStyle: boxedWidgets
    iconStyle: theme
    statusStyle: dot
    hideVersion: true
    fullWidth: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: false
    layout:
      Core:
        style: row
        columns: 4
        icon: mdi-shield-check-outline
      Platform:
        style: row
        columns: 3
        icon: mdi-kubernetes
      Compute:
        style: row
        columns: 4
        icon: mdi-server
  services.yaml: |
    - Core:
        - Pocket ID:
            icon: pocket-id.png
            href: https://auth.l3b.cc.cd
            description: Identity
            ping: https://auth.l3b.cc.cd
        - AdGuard Home:
            icon: adguard-home.png
            href: https://dns.l3b.cc.cd
            description: DNS filtering
            ping: https://dns.l3b.cc.cd
        - Beszel:
            icon: beszel.png
            href: https://beszel.l3b.cc.cd
            description: Monitoring
            ping: https://beszel.l3b.cc.cd
        - Komodo:
            icon: komodo.png
            href: https://komodo.l3b.cc.cd
            description: Docker deployments
            ping: https://komodo.l3b.cc.cd
    - Platform:
        - Argo CD:
            icon: argo-cd.png
            href: https://argocd.l3b.cc.cd
            description: GitOps
            ping: https://argocd.l3b.cc.cd
        - Headlamp:
            icon: headlamp.png
            href: https://headlamp.l3b.cc.cd
            description: Kubernetes
            ping: https://headlamp.l3b.cc.cd
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.l3b.cc.cd
            description: Storage
            ping: https://longhorn.l3b.cc.cd
    - Compute:
        - Proxmox:
            icon: proxmox.png
            href: https://px.l3b.cc.cd
            description: Cluster
            ping: https://px.l3b.cc.cd
        - px10:
            icon: proxmox.png
            href: https://px10.l3b.cc.cd
            description: Node
            ping: https://px10.l3b.cc.cd
        - px20:
            icon: proxmox.png
            href: https://px20.l3b.cc.cd
            description: Node
            ping: https://px20.l3b.cc.cd
        - px30:
            icon: proxmox.png
            href: https://px30.l3b.cc.cd
            description: Node
            ping: https://px30.l3b.cc.cd
  widgets.yaml: |
    - greeting:
        text: l3b.cc.cd
        text_size: 2xl
    - datetime:
        text_size: xl
        locale: en-IN
        format:
          dateStyle: full
          timeStyle: short
          hourCycle: h23
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  kubernetes.yaml: |
    mode: cluster
    ingress: false
  proxmox.yaml: |
    ---
    # Proxmox widgets are intentionally not configured.
  bookmarks.yaml: "[]"
  docker.yaml: "{}"
  custom.css: |
    #page_wrapper {
      background:
        radial-gradient(900px circle at 5% -10%, rgba(6, 182, 212, .16), transparent 46%),
        radial-gradient(760px circle at 100% 0%, rgba(99, 102, 241, .14), transparent 42%),
        #020617;
    }
    #information-widgets {
      margin-top: 1.5rem;
      padding: 1rem 1.25rem;
      border: 1px solid rgba(103, 232, 249, .14);
      border-radius: 1rem;
      background: rgba(15, 23, 42, .72);
      box-shadow: 0 18px 45px rgba(2, 6, 23, .32);
      backdrop-filter: blur(16px);
    }
    .service-group-name {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .service-card {
      min-height: 5rem;
      margin-bottom: .75rem !important;
      border: 1px solid rgba(148, 163, 184, .14);
      border-radius: .9rem !important;
      background: rgba(15, 23, 42, .72) !important;
      box-shadow: 0 10px 28px rgba(2, 6, 23, .2) !important;
      backdrop-filter: blur(12px);
    }
    .service-card:hover {
      transform: translateY(-2px);
      border-color: rgba(34, 211, 238, .42);
      box-shadow: 0 16px 34px rgba(6, 182, 212, .14) !important;
    }
    .service-title-text > div:first-child {
      font-size: 1rem;
    }
    @media (max-width: 640px) {
      #information-widgets {
        margin: .75rem;
        padding: .75rem;
      }
    }
  custom.js: ""
