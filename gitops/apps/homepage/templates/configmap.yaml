apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  settings.yaml: |
    title: l3b.cc.cd
    theme: dark
    color: slate
    headerStyle: underlined
    statusStyle: dot
    hideVersion: true
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local
    layout:
      Monitoring:
        style: row
        columns: 2
      Control:
        style: row
        columns: 2
      Platform:
        style: row
        columns: 3
      Compute:
        style: row
        columns: 4
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: false
  services.yaml: |
    - Monitoring:
        - AdGuard Home:
            icon: adguard-home.png
            href: https://dns.l3b.cc.cd
            description: DNS filtering
            ping: https://dns.l3b.cc.cd
            widget:
              type: adguard
              url: http://10.1.1.2:3000
              username: "{{ "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}" }}"
              password: "{{ "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}" }}"
              fields: ["queries", "blocked", "latency"]
        - Beszel:
            icon: beszel.png
            href: https://beszel.l3b.cc.cd
            description: Monitoring
            ping: https://beszel.l3b.cc.cd
            widget:
              type: beszel
              url: http://10.1.1.7:8090
              username: "{{ "{{HOMEPAGE_VAR_BESZEL_USERNAME}}" }}"
              password: "{{ "{{HOMEPAGE_VAR_BESZEL_PASSWORD}}" }}"
              version: 2
              fields: ["systems", "up"]
    - Control:
        - Pocket ID:
            icon: pocket-id.png
            href: https://auth.l3b.cc.cd
            description: Identity
            ping: https://auth.l3b.cc.cd
        - Komodo:
            icon: komodo.png
            href: https://komodo.l3b.cc.cd
            description: Docker deployments
            ping: https://komodo.l3b.cc.cd
            widget:
              type: komodo
              url: http://10.1.1.4:9120
              key: "{{ "{{HOMEPAGE_VAR_KOMODO_API_KEY}}" }}"
              secret: "{{ "{{HOMEPAGE_VAR_KOMODO_API_SECRET}}" }}"
              showSummary: true
    - Platform:
        - Argo CD:
            icon: argo-cd.png
            href: https://argocd.l3b.cc.cd
            description: GitOps
            ping: https://argocd.l3b.cc.cd
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: "{{ "{{HOMEPAGE_VAR_ARGOCD_API_TOKEN}}" }}"
              fields: ["apps", "synced", "outOfSync", "degraded"]
        - Headlamp:
            icon: headlamp.png
            href: https://headlamp.l3b.cc.cd
            description: Kubernetes
            ping: https://headlamp.l3b.cc.cd
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.l3b.cc.cd
            description: Storage
            ping: https://longhorn.l3b.cc.cd
    - Compute:
        - Proxmox:
            icon: proxmox.png
            href: https://px.l3b.cc.cd
            description: Cluster
            ping: https://px.l3b.cc.cd
            widget:
              type: proxmox
              url: https://10.1.1.10:8006
              username: "{{ "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_ID}}" }}"
              password: "{{ "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_SECRET}}" }}"
              fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
        - px10:
            icon: proxmox.png
            href: https://px10.l3b.cc.cd
            description: Node
            ping: https://px10.l3b.cc.cd
            widget:
              type: proxmox
              url: https://10.1.1.10:8006
              username: "{{ "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_ID}}" }}"
              password: "{{ "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_SECRET}}" }}"
              node: px10
              fields: ["resources.cpu", "resources.mem"]
        - px20:
            icon: proxmox.png
            href: https://px20.l3b.cc.cd
            description: Node
            ping: https://px20.l3b.cc.cd
            widget:
              type: proxmox
              url: https://10.1.1.20:8006
              username: "{{ "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_ID}}" }}"
              password: "{{ "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_SECRET}}" }}"
              node: px20
              fields: ["resources.cpu", "resources.mem"]
        - px30:
            icon: proxmox.png
            href: https://px30.l3b.cc.cd
            description: Node
            ping: https://px30.l3b.cc.cd
            widget:
              type: proxmox
              url: https://10.1.1.30:8006
              username: "{{ "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_ID}}" }}"
              password: "{{ "{{HOMEPAGE_VAR_PROXMOX_API_TOKEN_SECRET}}" }}"
              node: px30
              fields: ["resources.cpu", "resources.mem"]
  widgets.yaml: |
    - datetime:
        text_size: md
        locale: en-IN
        format:
          dateStyle: medium
          timeStyle: short
          hourCycle: h23
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: K8s
        nodes:
          show: false
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: false
  kubernetes.yaml: |
    mode: cluster
    ingress: false
  proxmox.yaml: |
    ---
    # Proxmox service widgets are configured in services.yaml.
  pve-root-ca.crt: |
{{ .Files.Get "files/pve-root-ca.crt" | indent 4 }}
  bookmarks.yaml: "[]"
  docker.yaml: "{}"
  custom.css: ""
  custom.js: |
    (() => {
      const units = ["B", "KB", "MB", "GB", "TB", "PB"];
      const setText = (element, value) => {
        if (element && element.textContent !== value) element.textContent = value;
      };
      const bytes = (value) => {
        const match = value.trim().match(/^([\d,.]+)\s*(B|KB|MB|GB|TB|PB)$/);
        if (!match) return null;
        const amount = Number(match[1].replace(/,/g, ""));
        return Number.isFinite(amount) ? amount * 1000 ** units.indexOf(match[2]) : null;
      };
      const display = (value) => {
        const index = Math.min(units.length - 1, Math.floor(Math.log(value) / Math.log(1000)));
        return `${(value / 1000 ** index).toFixed(index ? 2 : 0)} ${units[index]}`;
      };
      const render = () => {
        document.querySelectorAll(".information-widget-longhorn-node").forEach((widget) => {
          const details = widget.querySelector("svg + div");
          const rows = details ? Array.from(details.children).filter((row) => row.classList.contains("flex-row")) : [];
          if (rows.length < 2 || rows[0].lastElementChild?.textContent !== "Free" || rows[1].lastElementChild?.textContent !== "Total") return;
          const free = bytes(rows[0].firstElementChild?.textContent || "");
          const total = bytes(rows[1].firstElementChild?.textContent || "");
          if (free === null || total === null || total < free) return;
          setText(rows[0].firstElementChild, display(total));
          setText(rows[0].lastElementChild, "Total");
          setText(rows[1].firstElementChild, display(total - free));
          setText(rows[1].lastElementChild, "Used");
          setText(details.querySelector(".information-widget-label"), "Longhorn");
        });
      };
      const start = () => {
        let queued = false;
        new MutationObserver(() => {
          if (!queued) {
            queued = true;
            requestAnimationFrame(() => {
              queued = false;
              render();
            });
          }
        }).observe(document.body, { childList: true, characterData: true, subtree: true });
        render();
      };
      document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", start, { once: true }) : start();
    })();
