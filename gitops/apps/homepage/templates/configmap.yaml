apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  settings.yaml: |
    title: l3b.cc.cd
    theme: dark
    color: slate
    headerStyle: underlined
    statusStyle: dot
    hideVersion: true
    layout:
      Monitoring:
        style: row
        columns: 2
      Control:
        style: row
        columns: 2
      Platform:
        style: row
        columns: 3
      Compute:
        style: row
        columns: 4
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: false
  services.yaml: |
    - Monitoring:
        - AdGuard Home:
            icon: adguard-home.png
            href: https://dns.l3b.cc.cd
            description: DNS filtering
            ping: https://dns.l3b.cc.cd
            widget:
              type: adguard
              url: http://10.1.1.2:3000
              username: "{{ "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}" }}"
              password: "{{ "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}" }}"
              fields: ["queries", "blocked", "latency"]
        - Beszel:
            icon: beszel.png
            href: https://beszel.l3b.cc.cd
            description: Monitoring
            ping: https://beszel.l3b.cc.cd
            widget:
              type: beszel
              url: http://10.1.1.7:8090
              username: "{{ "{{HOMEPAGE_VAR_BESZEL_USERNAME}}" }}"
              password: "{{ "{{HOMEPAGE_VAR_BESZEL_PASSWORD}}" }}"
              version: 2
              fields: ["systems", "up"]
    - Control:
        - Pocket ID:
            icon: pocket-id.png
            href: https://auth.l3b.cc.cd
            description: Identity
            ping: https://auth.l3b.cc.cd
        - Komodo:
            icon: komodo.png
            href: https://komodo.l3b.cc.cd
            description: Docker deployments
            ping: https://komodo.l3b.cc.cd
    - Platform:
        - Argo CD:
            icon: argo-cd.png
            href: https://argocd.l3b.cc.cd
            description: GitOps
            ping: https://argocd.l3b.cc.cd
        - Headlamp:
            icon: headlamp.png
            href: https://headlamp.l3b.cc.cd
            description: Kubernetes
            ping: https://headlamp.l3b.cc.cd
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.l3b.cc.cd
            description: Storage
            ping: https://longhorn.l3b.cc.cd
    - Compute:
        - Proxmox:
            icon: proxmox.png
            href: https://px.l3b.cc.cd
            description: Cluster
            ping: https://px.l3b.cc.cd
        - px10:
            icon: proxmox.png
            href: https://px10.l3b.cc.cd
            description: Node
            ping: https://px10.l3b.cc.cd
        - px20:
            icon: proxmox.png
            href: https://px20.l3b.cc.cd
            description: Node
            ping: https://px20.l3b.cc.cd
        - px30:
            icon: proxmox.png
            href: https://px30.l3b.cc.cd
            description: Node
            ping: https://px30.l3b.cc.cd
  widgets.yaml: |
    - datetime:
        text_size: md
        locale: en-IN
        format:
          dateStyle: medium
          timeStyle: short
          hourCycle: h23
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Kubernetes Cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  kubernetes.yaml: |
    mode: cluster
    ingress: false
  proxmox.yaml: |
    ---
    # Proxmox widgets are intentionally not configured.
  bookmarks.yaml: "[]"
  docker.yaml: "{}"
  custom.css: ""
  custom.js: ""
