replicaCount: 2
image:
  tag: 1.30.1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 384Mi
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
        topologyKey: kubernetes.io/hostname
monitoring:
  podMonitorEnabled: false
